<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110F">
<title>Embers — Streaks</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110F;
    --surface: #1C1815;
    --surface-raised: #23201C;
    --rule: #322C27;
    --text: #F2EDE6;
    --text-dim: #9C9086;
    --text-faint: #6B6259;
    --ember: #E8973B;
    --ember-dim: #6B4A24;
    --done: #6FA37E;
    --done-dim: #2E3B31;
    --danger: #C96A5A;
    --radius: 14px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.top {
    padding: 28px 20px 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  header.top h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-flame {
    font-size: 27px;
    display: inline-block;
    filter: drop-shadow(0 0 6px rgba(232,151,59,0.45));
  }

  /* Flames rising from the bottom of the screen on check-in */
  #flameLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .flame-particle {
    position: absolute;
    bottom: -10vh;
    transform: translateX(-50%);
    animation-name: flameRise;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes flameRise {
    0%   { opacity: 0;   transform: translate(-50%, 0)               scale(0.6)  rotate(0deg); }
    10%  { opacity: 1; }
    55%  { opacity: 1;   transform: translate(calc(-50% + var(--drift) * 0.5), -55vh) scale(1)    rotate(calc(var(--rot) * 0.5)); }
    100% { opacity: 0;   transform: translate(calc(-50% + var(--drift)), -105vh)      scale(1.15) rotate(var(--rot)); }
  }

  header.top .sub {
    font-size: 13px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  .add-btn {
    background: none;
    border: 1.5px solid var(--rule);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .add-btn:active { background: var(--surface-raised); }

  main { flex: 1; padding: 0 20px 100px; }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty .flame { font-size: 40px; display: block; margin-bottom: 14px; }
  .empty p { margin: 6px 0; line-height: 1.5; }
  .empty button {
    margin-top: 18px;
    background: var(--ember);
    color: #1A1310;
    border: none;
    padding: 11px 22px;
    border-radius: 999px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }

  .goal-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .goal-row:last-child { border-bottom: none; }

  .goal-icon {
    font-size: 26px;
    width: 40px;
    text-align: center;
    flex-shrink: 0;
  }

  .goal-info { flex: 1; min-width: 0; }
  .goal-title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .goal-streak {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .streak-num { font-family: var(--serif); color: var(--ember); font-weight: 600; }
  .streak-num.zero { color: var(--text-faint); }

  .check-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--rule);
    background: transparent;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .check-btn.done {
    background: var(--done-dim);
    border-color: var(--done);
    color: var(--done);
  }
  .check-btn.pulse { animation: pulse 0.35s ease; }
  @keyframes pulse {
    0% { transform: scale(1); }
    45% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  /* Sheets */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 10px 22px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    z-index: 11;
    max-height: 88vh;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet .grabber {
    width: 36px; height: 4px;
    background: var(--rule);
    border-radius: 2px;
    margin: 6px auto 18px;
  }

  .sheet h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 18px;
  }

  label.field-label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--rule);
    color: var(--text);
    padding: 13px 14px;
    border-radius: 10px;
    font-size: 16px;
    font-family: var(--sans);
    margin-bottom: 20px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--ember); }

  .icon-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .icon-choice {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    background: var(--surface-raised);
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-choice.selected { border-color: var(--ember); background: var(--ember-dim); }

  .primary-btn {
    width: 100%;
    background: var(--ember);
    color: #1A1310;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.4; }

  .cancel-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    color: var(--text-dim);
    font-size: 14px;
    background: none;
    border: none;
    width: 100%;
    padding: 6px;
    cursor: pointer;
  }

  /* Detail sheet */
  .detail-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .detail-head .goal-icon { font-size: 34px; width: auto; }
  .detail-head h2 { margin: 0; }

  .stat-row {
    display: flex;
    gap: 32px;
    margin-bottom: 26px;
  }
  .stat { flex: 1; }
  .stat .num {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 600;
    color: var(--ember);
    line-height: 1;
  }
  .stat.longest .num { color: var(--text); }
  .stat .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .today-btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 26px;
    background: var(--ember);
    color: #1A1310;
  }
  .today-btn.done { background: var(--done); color: #12211A; }

  .grid-label {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .day-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    margin-bottom: 28px;
  }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 4px;
    background: var(--surface-raised);
    border: 1px solid var(--rule);
  }
  .day-cell.done { background: var(--ember); border-color: var(--ember); }

  .delete-link {
    display: block;
    text-align: center;
    color: var(--danger);
    background: none;
    border: none;
    font-size: 14px;
    padding: 10px;
    width: 100%;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1><span class="header-flame" aria-hidden="true">🔥</span>Embers</h1>
      <div class="sub" id="dateLine"></div>
    </div>
    <button class="add-btn" id="openAdd" aria-label="Add goal">+</button>
  </header>
  <main id="list"></main>
</div>

<div id="flameLayer"></div>
<div class="sheet-backdrop" id="backdrop"></div>

<div class="sheet" id="addSheet">
  <div class="grabber"></div>
  <h2>New goal</h2>
  <label class="field-label" for="goalTitle">What are you keeping alive?</label>
  <input type="text" id="goalTitle" placeholder="e.g. Learn Italian" maxlength="40">
  <label class="field-label">Icon</label>
  <div class="icon-grid" id="iconGrid"></div>
  <button class="primary-btn" id="saveGoal" disabled>Add goal</button>
  <button class="cancel-link" id="cancelAdd">Cancel</button>
</div>

<div class="sheet" id="detailSheet">
  <div class="grabber"></div>
  <div class="detail-head">
    <span class="goal-icon" id="detailIcon"></span>
    <h2 id="detailTitle"></h2>
  </div>
  <div class="stat-row">
    <div class="stat">
      <div class="num" id="detailCurrent"></div>
      <div class="label">current streak</div>
    </div>
    <div class="stat longest">
      <div class="num" id="detailLongest"></div>
      <div class="label">longest streak</div>
    </div>
  </div>
  <button class="today-btn" id="detailToggle"></button>
  <div class="grid-label">Last 30 days</div>
  <div class="day-grid" id="dayGrid"></div>
  <button class="delete-link" id="deleteGoal">Delete this goal</button>
</div>

<script>
const ICONS = ["🎯","🇮🇹","🇫🇷","🇪🇸","📚","✍️","💪","🏃","🧘","💧","🎸","🎨","🧠","🥗","🚭","😴","☀️","💰","🧹","📵"];
const STORE_KEY = "embers.goals.v1";

let goals = loadGoals();
let selectedIcon = ICONS[0];
let activeGoalId = null;

function loadGoals() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveGoals() {
  localStorage.setItem(STORE_KEY, JSON.stringify(goals));
}

function todayKey(offsetDays = 0) {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0,10);
}

function currentStreak(goal) {
  const done = new Set(goal.completedDays);
  let cursorOffset = done.has(todayKey(0)) ? 0 : -1;
  if (cursorOffset === -1 && !done.has(todayKey(-1))) return 0;
  let streak = 0;
  while (done.has(todayKey(cursorOffset))) {
    streak++;
    cursorOffset--;
  }
  return streak;
}

function longestStreak(goal) {
  const dates = [...goal.completedDays].sort();
  if (dates.length === 0) return 0;
  let longest = 1, current = 1;
  for (let i = 1; i < dates.length; i++) {
    const prev = new Date(dates[i-1]);
    const cur = new Date(dates[i]);
    const diffDays = Math.round((cur - prev) / 86400000);
    if (diffDays === 1) current++;
    else if (diffDays > 1) current = 1;
    longest = Math.max(longest, current);
  }
  return longest;
}

function isDoneToday(goal) {
  return goal.completedDays.includes(todayKey(0));
}

function toggleToday(goalId) {
  const goal = goals.find(g => g.id === goalId);
  const key = todayKey(0);
  const idx = goal.completedDays.indexOf(key);
  if (idx >= 0) goal.completedDays.splice(idx, 1);
  else goal.completedDays.push(key);
  saveGoals();
}

function burstFlames() {
  const layer = document.getElementById('flameLayer');
  const count = 9;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'flame-particle';
    el.textContent = '🔥';
    const xPos = 10 + Math.random() * 80; // vw, keep away from screen edges
    const drift = (Math.random() - 0.5) * 140;
    const rot = (Math.random() - 0.5) * 40;
    const size = 20 + Math.random() * 24;
    const duration = 1900 + Math.random() * 1400;
    const delay = Math.random() * 450;
    el.style.left = xPos + 'vw';
    el.style.fontSize = size + 'px';
    el.style.setProperty('--drift', drift + 'px');
    el.style.setProperty('--rot', rot + 'deg');
    el.style.animationDuration = duration + 'ms';
    el.style.animationDelay = delay + 'ms';
    layer.appendChild(el);
    setTimeout(() => el.remove(), duration + delay + 100);
  }
}

function renderDateLine() {
  document.getElementById('dateLine').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = "";
  if (goals.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <span class="flame">🔥</span>
        <p>No goals yet.</p>
        <p>Add something you want to keep alive — day after day.</p>
        <button id="emptyAdd">Add a goal</button>
      </div>`;
    document.getElementById('emptyAdd').onclick = openAddSheet;
    return;
  }
  goals.forEach(goal => {
    const streak = currentStreak(goal);
    const done = isDoneToday(goal);
    const row = document.createElement('div');
    row.className = 'goal-row';
    row.innerHTML = `
      <span class="goal-icon">${goal.emoji}</span>
      <div class="goal-info">
        <p class="goal-title">${escapeHtml(goal.title)}</p>
        <div class="goal-streak"><span class="streak-num ${streak === 0 ? 'zero' : ''}">${streak}</span> day${streak === 1 ? '' : 's'}</div>
      </div>
      <button class="check-btn ${done ? 'done' : ''}" data-id="${goal.id}">${done ? '✓' : ''}</button>
    `;
    row.querySelector('.goal-info').onclick = () => openDetail(goal.id);
    row.querySelector('.goal-icon').onclick = () => openDetail(goal.id);
    const btn = row.querySelector('.check-btn');
    btn.onclick = (e) => {
      e.stopPropagation();
      const wasDone = isDoneToday(goal);
      toggleToday(goal.id);
      btn.classList.add('pulse');
      if (!wasDone) {
        burstFlames();
      }
      renderList();
    };
    list.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Add sheet
const addSheet = document.getElementById('addSheet');
const detailSheet = document.getElementById('detailSheet');
const backdrop = document.getElementById('backdrop');

function openSheet(el) { backdrop.classList.add('open'); el.classList.add('open'); }
function closeSheets() {
  backdrop.classList.remove('open');
  addSheet.classList.remove('open');
  detailSheet.classList.remove('open');
}
backdrop.onclick = closeSheets;

function buildIconGrid() {
  const grid = document.getElementById('iconGrid');
  grid.innerHTML = "";
  ICONS.forEach(icon => {
    const btn = document.createElement('div');
    btn.className = 'icon-choice' + (icon === selectedIcon ? ' selected' : '');
    btn.textContent = icon;
    btn.onclick = () => { selectedIcon = icon; buildIconGrid(); };
    grid.appendChild(btn);
  });
}

function openAddSheet() {
  document.getElementById('goalTitle').value = '';
  selectedIcon = ICONS[0];
  buildIconGrid();
  document.getElementById('saveGoal').disabled = true;
  openSheet(addSheet);
  setTimeout(() => document.getElementById('goalTitle').focus(), 300);
}
document.getElementById('openAdd').onclick = openAddSheet;
document.getElementById('cancelAdd').onclick = closeSheets;

document.getElementById('goalTitle').addEventListener('input', (e) => {
  document.getElementById('saveGoal').disabled = e.target.value.trim().length === 0;
});

document.getElementById('saveGoal').onclick = () => {
  const title = document.getElementById('goalTitle').value.trim();
  if (!title) return;
  goals.push({ id: crypto.randomUUID(), title, emoji: selectedIcon, completedDays: [] });
  saveGoals();
  closeSheets();
  renderList();
};

// Detail sheet
function openDetail(goalId) {
  activeGoalId = goalId;
  renderDetail();
  openSheet(detailSheet);
}

function renderDetail() {
  const goal = goals.find(g => g.id === activeGoalId);
  if (!goal) return;
  document.getElementById('detailIcon').textContent = goal.emoji;
  document.getElementById('detailTitle').textContent = goal.title;
  document.getElementById('detailCurrent').textContent = currentStreak(goal);
  document.getElementById('detailLongest').textContent = longestStreak(goal);

  const done = isDoneToday(goal);
  const toggleBtn = document.getElementById('detailToggle');
  toggleBtn.textContent = done ? '✓ Done today' : 'Mark today done';
  toggleBtn.className = 'today-btn' + (done ? ' done' : '');

  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  const doneSet = new Set(goal.completedDays);
  for (let i = 29; i >= 0; i--) {
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (doneSet.has(todayKey(-i)) ? ' done' : '');
    grid.appendChild(cell);
  }
}

document.getElementById('detailToggle').onclick = () => {
  const goal = goals.find(g => g.id === activeGoalId);
  const wasDone = isDoneToday(goal);
  toggleToday(activeGoalId);
  if (!wasDone) {
    burstFlames();
  }
  renderDetail();
  renderList();
};

document.getElementById('deleteGoal').onclick = () => {
  if (!confirm('Delete this goal and its history?')) return;
  goals = goals.filter(g => g.id !== activeGoalId);
  saveGoals();
  closeSheets();
  renderList();
};

renderDateLine();
renderList();
</script>
</body>
</html>
